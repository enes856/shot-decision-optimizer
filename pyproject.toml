[project]
name = "shot-decision-optimizer"
version = "0.1.0"
description = "big data project"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]

dependencies = [
    # Data manipulation
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Data source
    "nba_api>=1.11.3",
    # Machine learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    # Data visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    # Experiment tracking
    "mlflow>=2.10.0",
    # App
    "streamlit>=1.28.0",
    # Jupyter
    "jupyter>=1.0.0",
    "ipython>=8.15.0",
    "ipykernel>=6.25.0",
    "isodate>=0.7.2",
    "polars>=1.35.2",
    "duckdb~=1.0.0",
    "tqdm>=4.67.1",
    "category-encoders>=2.9.0",
    "streamlit-authenticator>=0.4.2",
    "graphviz>=0.20.1",
    "numba==0.59.1",
    "llvmlite==0.42.0",
    "shap>=0.45.0",
    "jupytext>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.jupytext]
# Formats to use for pairing notebooks
formats = "ipynb,py:percent"

# Keep minimal metadata to reduce noisy diffs
notebook_metadata_filter = "-all, kernelspec, language_info"

# Use percent format for text representations (.py) across the repo
# This ensures notebooks pair with .py files using the `# %%` cell markers.